<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Hindi Subbed</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#0f1115;--pn:#1a1d26;--ln:#2a2f40;--tx:#e6e8f0;--mu:#8b92a8;--ac:#ff8c00;--ok:#22c55e;--rd:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui}
.w{max-width:760px;margin:auto;padding:12px 12px 90px}
h1{font-size:20px;color:var(--ac);text-align:center;}
h2{font-size:16px;color:var(--ac);border-bottom:1px solid var(--ln);padding-bottom:6px;margin:18px 0 8px}
label{display:block;margin:10px 0 4px;color:var(--mu);font-size:11px;font-weight:700;text-transform:uppercase}
input,select,textarea{width:100%;background:var(--pn);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:11px;outline:none}
textarea{min-height:70px}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn{background:var(--pn);border:1px solid var(--ln);color:var(--tx)}
.btn.on{background:var(--ac);color:#111;border-color:var(--ac)}
.go{background:var(--ac);color:#111;width:100%;margin-top:12px;padding:13px;font-size:15px}
.go2{background:var(--ok);color:#111;width:100%;margin-top:12px;padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border:1px solid var(--ln);background:var(--pn);border-radius:10px;margin-top:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0;position:sticky;top:0;background:var(--bg);z-index:5}
.p{display:none}.p.on{display:block}
#log{position:fixed;left:12px;right:12px;bottom:12px;background:#111;padding:12px;border-radius:12px;border:1px solid var(--ln);display:none;z-index:99;white-space:pre-wrap;text-align:center;font-weight:bold;}
#appBody{display:none;}
</style></head><body><div class="w">

<h1>⚙️ Admin Panel</h1>

<!-- LOGIN SECTION (SIRF TOKEN) -->
<div id="loginSection" style="background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:25px 20px;margin-top:20px;text-align:center;">
  <h2 style="border:none; margin:0 0 5px 0;">🔑 Admin Login</h2>
  <p style="color:var(--mu);font-size:12px;margin-bottom:20px;">Sirf apna GitHub Token (Password) daaliye.</p>
  
  <input id="ghTok" type="password" placeholder="ghp_xxxx..." style="text-align:center; font-weight:bold; font-size:16px; letter-spacing:1px; margin-bottom:15px;">
  
  <button class="go" id="btnLoad" onclick="loadFromGithub()">🔓 Login Panel</button>
</div>

<!-- MAIN ADMIN AREA -->
<div id="appBody">
  <div class="tabs">
    <button data-t="post" class="btn on" onclick="tab('post')">Add Post</button>
    <button data-t="ep" class="btn" onclick="tab('ep')">Episodes</button>
    <button data-t="del" class="btn" onclick="tab('del')">Delete</button>
    <button data-t="sh" class="btn" onclick="tab('sh')">Shorteners</button>
    <button data-t="vip" class="btn" onclick="tab('vip')">VIP</button>
    <button data-t="ads" class="btn" onclick="tab('ads')">Ads & App</button>
    <button data-t="set" class="btn" onclick="tab('set')">Settings</button>
    <button data-t="push" class="btn" onclick="tab('push')" style="background:var(--ok);color:#111">🚀 Push</button>
  </div>

  <div class="p on" id="t-post">
    <h2>Post Add</h2>
    <label>Poster Image URL</label><input id="pImg" placeholder="https://...">
    <label>Anime Name *</label><input id="pName" placeholder="Solo Leveling Hindi Sub">
    <label>Category *</label><input id="pCat" placeholder="Action">
    <label>Genres (comma separated)</label><input id="pGen" placeholder="Action, Fantasy">
    <label>Release Year</label><input id="pYr" placeholder="2024">
    <label>Story</label><textarea id="pSt"></textarea>
    <button class="go" onclick="addPost()">+ Add Post</button>
    <div id="plist"></div>
  </div>

  <div class="p" id="t-ep">
    <h2>Add Episode</h2>
    <input id="eSearch" placeholder="Search post..." oninput="renderEpSel()" style="margin-bottom:6px">
    <select id="eP"></select>
    <div class="grid2">
      <div><label>Season</label><input id="eS" value="01"></div>
      <div><label>Episode No *</label><input id="eN" placeholder="01"></div>
    </div>
    <label>Quality</label><select id="eQl"><option>FHD</option><option selected>HD</option><option>SD</option></select>
    <label>Play Link (Optional)</label><input id="ePl" placeholder="https://...">
    <label>Play Password (Optional)</label><input id="ePw" placeholder="Leave blank if no lock">
    <label>Real Download Link (Google Drive etc.) *</label><input id="eDl" placeholder="https://...">
    <button class="go" id="btnEp" onclick="addEpisode()">+ Add Episode (Auto Shortener)</button>
  </div>

  <div class="p" id="t-del">
    <h2>Delete Posts</h2>
    <div id="dlist"></div>
  </div>

  <div class="p" id="t-sh">
    <h2>Shorteners</h2>
    <div class="grid2">
      <div><label>Domain</label><input id="sD" placeholder="gplinks.com"></div>
      <div><label>API Key</label><input id="sK"></div>
    </div>
    <button class="go" onclick="addSh()">+ Add Shortener</button>
    <div id="slist"></div>
  </div>

  <div class="p" id="t-vip">
    <h2>Create VIP Pass</h2>
    <div class="grid2">
      <div><label>User Gmail *</label><input id="vE" placeholder="user@gmail.com"></div>
      <div><label>Passcode *</label><input id="vP"></div>
    </div>
    <label>Duration</label><select id="vD"><option value="30">30 Days</option><option value="90">90 Days</option><option value="365">1 Year</option></select>
    <button class="go" onclick="addVip()">+ Add VIP User</button>
    <div id="vlist"></div>
  </div>

  <div class="p" id="t-ads">
    <h2>Ads & APK Link</h2>
    <label>Header Ad Code</label><textarea id="c_head"></textarea>
    <label>Body Ad (Popunder)</label><textarea id="c_body"></textarea>
    <label>Banner Ad (iframe)</label><textarea id="c_ban"></textarea>
    <label>App APK Link</label><input id="c_apk" placeholder="https://...">
  </div>

  <div class="p" id="t-set">
    <h2>Site Settings</h2>
    <label>Telegram Channel Link</label><input id="c_tg" placeholder="https://t.me/...">
    <label>Telegram Group</label><input id="c_gr">
    <label>Website URL</label><input id="c_web">
    <label>Site Name</label><input id="c_site" value="Hindi Subbed Anime">
  </div>

  <div class="p" id="t-push">
    <h2>Save Changes to Live Site</h2>
    <p style="color:var(--mu);font-size:12px">Jab aap posts add kar lein, toh yahan se PUSH dabayein taaki site live update ho jaye.</p>
    <button class="go2" id="btnPush" onclick="pushToGithub()">🚀 Push to GitHub (Save Data)</button>
  </div>
</div>

<div id="log"></div>
</div>

<script>
// ==========================================
// YAHAN APNA USERNAME AUR REPO NAME DAALEIN
// ==========================================
const GITHUB_USERNAME = "ringrongringbro-lab"; 
const GITHUB_REPO = "hindi-subbed-anime";
// ==========================================
  
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db={posts:[],vip:[],cfg:{},sh:[],paid:[]}, sha=null;

const H=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');

// Background encryption magic (Ab PIN ki zarurat nahi)
async function getVk(){ return await H('Hindi Subbed Anime_VK_BULLETPROOF_2024'); }
async function enc(t,p){ const e=new TextEncoder(); const s=crypto.getRandomValues(new Uint8Array(16)); const iv=crypto.getRandomValues(new Uint8Array(12)); const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:100000,hash:'SHA-256'},await crypto.subtle.importKey('raw',e.encode(p),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt']); const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,e.encode(t))); const all=new Uint8Array(s.length+iv.length+ct.length); all.set(s,0); all.set(iv,s.length); all.set(ct,s.length+iv.length); return btoa(String.fromCharCode(...all)); }

function log(t,ok=true){ const el=$('log'); el.textContent=t; el.style.display='block'; el.style.borderColor=ok?'#22c55e':'#ef4444'; setTimeout(()=>el.style.display='none',4000); }
function tab(t){ document.querySelectorAll('.p').forEach(e=>e.classList.toggle('on',e.id==='t-'+t)); document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t)); }

// SIRF TOKEN SE LOGIN
async function loadFromGithub(){
  const tok=$('ghTok').value.trim();
  if(!tok) return log('GitHub Token daaliye',false);
  $('btnLoad').disabled=true; $('btnLoad').textContent='Verifying Token...';
  
  try{
    const r=await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/data/data.json`,{headers:{Authorization:`Bearer ${tok}`,Accept:'application/vnd.github.v3+json'}});
    if(r.status===404){ db={posts:[],vip:[],cfg:{},sh:[],paid:[]}; sha=null; log('Fresh start. Ready!'); }
    else{ 
      if(!r.ok) throw new Error("Invalid GitHub Token"); 
      const j=await r.json(); sha=j.sha; 
      const raw=atob(j.content.replace(/\n/g,'')); const content=JSON.parse(decodeURIComponent(escape(raw))); 
      db.posts=content.posts||[]; db.vip=content.vip||[]; db.cfg=content.cfg||{}; db.sh=content.sh||[];
      ['head','body','ban','apk','tg','gr','web','site'].forEach(k=>{ if($('c_'+k)) $('c_'+k).value=db.cfg[k]||''; }); 
      log(`Login Success! ${db.posts.length} posts loaded`); 
    }
    $('loginSection').style.display='none';
    $('appBody').style.display='block';
    renderAll();
  }catch(e){ log('Login Fail: '+e.message,false); $('btnLoad').textContent='🔓 Login Panel'; } 
  $('btnLoad').disabled=false; 
}

function renderAll(){ 
  $('plist').innerHTML=db.posts.map(p=>`<div class="row"><div><b>${esc(p.name)}</b><br><small>${p.eps.length} eps</small></div></div>`).join(''); 
  renderEpSel(); 
  $('dlist').innerHTML=db.posts.map((p,i)=>`<div class="row"><div>${esc(p.name)}</div><button class="danger" onclick="delPost(${i})">Delete</button></div>`).join('');
  $('slist').innerHTML=db.sh.map((s,i)=>`<div class="row"><div>${esc(s.d)}</div><button class="danger" onclick="db.sh.splice(${i},1);renderAll()">Del</button></div>`).join('');
}
function renderEpSel(){ const q=$('eSearch').value.toLowerCase(); const filtered=db.posts.filter(p=>p.name.toLowerCase().includes(q)); $('eP').innerHTML=filtered.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join(''); }

function delPost(i){ if(confirm('Delete?')){ db.posts.splice(i,1); renderAll(); log('Deleted'); } }
function addSh(){ const d=$('sD').value.trim().replace(/^https?:\/\//,'').replace(/\/.*/,''); const k=$('sK').value.trim(); if(!d||!k) return; db.sh.push({d,k}); $('sD').value=$('sK').value=''; renderAll(); log('Added'); }

function addPost(){
  const name=$('pName').value.trim(); if(!name) return log('Name required',false);
  db.posts.unshift({id:Date.now().toString(36),img:$('pImg').value.trim(),name,cat:$('pCat').value.trim(),gen:$('pGen').value.split(',').map(s=>s.trim()).filter(Boolean),yr:$('pYr').value.trim(),story:$('pSt').value.trim(),updated:Date.now(),eps:[]});
  $('pName').value=''; log('Post added'); renderAll();
}

async function addEpisode(){
  const post=db.posts.find(x=>x.id===$('eP').value); if(!post) return log('Post select karo',false);
  const real=$('eDl').value.trim(); if(!real) return log('Real DL daalo',false);
  if(!db.sh.length) return log('Shortener add karo pehle',false);
  
  $('btnEp').textContent = 'Generating Links...';
  
  const epId = Date.now().toString(36);
  const baseUrl = window.location.href.split('/').slice(0,-1).join('/');
  const targetUrl = `${baseUrl}/verify.html?id=${post.id}&ep=${epId}&done=1`;
  
  const shorts=[];
  for(const s of db.sh){ 
    try{ 
      const r=await fetch(`https://${s.d}/api?api=${encodeURIComponent(s.k)}&url=${encodeURIComponent(targetUrl)}`); 
      const j=await r.json(); const l=j.shortenedUrl||j.short_url; 
      if(l) shorts.push(l); 
    }catch(e){} 
  }
  
  if(!shorts.length) { $('btnEp').textContent = '+ Add Episode'; return log('Shortener API fail',false); }

  const vk=await getVk();
  const pd=await enc(real, vk);
  let play=$('ePl').value.trim(), lock=0; if(play && $('ePw').value.trim()){ play=await enc(play, $('ePw').value.trim()); lock=1; }
  
  post.eps.push({id:epId, s:$('eS').value.trim()||'01', n:$('eN').value.trim(), q:$('eQl').value, play, lock, pd, short:shorts});
  $('eN').value=$('eDl').value=''; $('btnEp').textContent = '+ Add Episode (Auto Shortener)';
  log('Episode Added Successfully!');
}

async function addVip(){ const email=$('vE').value.trim().toLowerCase(), pass=$('vP').value.trim(); if(!email||!pass) return; const vk=await getVk(); const k=await enc(vk, pass); const h=await H(pass); db.vip.push({email,h,k,exp:Date.now()+parseInt($('vD').value)*86400000}); log('VIP added'); $('vE').value=$('vP').value=''; }

async function pushToGithub(){
  const tok=$('ghTok').value.trim();
  ['head','body','ban','apk','tg','gr','web','site'].forEach(k=>{ const el=$('c_'+k); if(el) db.cfg[k]=el.value.trim(); });
  db.cfg.sh = db.sh; 
  
  $('btnPush').disabled=true; $('btnPush').textContent='Pushing...';
  try{
    const pub={posts:db.posts.map(p=>{ const {eps,...rest}=p; return {...rest, eps: eps.map(({dl,...e})=>e)}; }), vip:db.vip, cfg:db.cfg, sh:db.sh};
    const jsonStr=JSON.stringify(pub,null,2);
    const content=btoa(unescape(encodeURIComponent(jsonStr)));
    const body={message:`Site Update ${new Date().toISOString()}`,content}; if(sha) body.sha=sha;
    
    const r=await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/data/data.json`,{method:'PUT',headers:{Authorization:`Bearer ${tok}`,Accept:'application/vnd.github.v3+json'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error(await r.text()); const j=await r.json(); sha=j.content.sha; 
    log(`✅ Pushed to Live Site Successfully!`,true);
  }catch(e){ log('Push fail: '+e.message,false); } 
  $('btnPush').disabled=false; $('btnPush').textContent='🚀 Push to GitHub (Save Data)';
}
</script></body></html>
