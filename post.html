<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post - Hindi Subbed Anime</title>
<meta name="description" content="Watch Hindi Subbed Anime Episode">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="wrap">
<header>
  <a href="index.html" class="logo">Hindi <span>Subbed Anime</span></a>
  <a class="pill" href="vip.html">VIP</a>
</header>

<div id="meta"></div>
<div id="player"></div>
<div id="quals"></div>
<div id="ban"></div>
</div>

<script src="assets/js/app.js"></script>
<script>
let POST=null;
let EPS=[];
const qs=new URLSearchParams(location.search);
const id=qs.get('id');

async function init(){
  const data=await load();
  const p=(data.posts||[]).find(x=>x.id===id);
  if(!p){ $('meta').innerHTML='<p class="mu">Post nahi mila. index.html se aao.</p>'; return; }
  POST=p;
  document.title=p.name+' - Hindi Subbed Anime';

  // SEO - keywords + OG like Cloudflare file
  const metaDesc=document.querySelector('meta[name="description"]');
  if(metaDesc) metaDesc.content=p.name+' Hindi Subbed - Watch Online';

  $('meta').innerHTML=`
    <div class="box" style="padding:0;overflow:hidden">
      <img src="${esc(cdnImg(p.img))}" style="width:100%;aspect-ratio:16/9;object-fit:cover" alt="${esc(p.name)}">
      <div style="padding:12px">
        <h2 style="margin:0 0 6px">${esc(p.name)}</h2>
        <p><a class="chip" href="index.html?c=${encodeURIComponent(kk(p.cat))}">${esc(p.cat)}</a> ${gens(p).map(g=>`<a class="chip" href="index.html?g=${encodeURIComponent(kk(g))}">${esc(g)}</a>`).join(' ')}</p>
        <p class="mu">${esc(p.yr||'')} ${p.keywords? '• '+esc(p.keywords.slice(0,80)) : ''}</p>
        <p style="margin-top:8px">${esc(p.story||'')}</p>
      </div>
    </div>
  `;

  // group by quality like Cloudflare
  const byQ={FHD:[],HD:[],SD:[]};
  (p.eps||[]).forEach(e=>{
    if(!byQ[e.q]) byQ[e.q]=[];
    byQ[e.q].push(e);
  });
  EPS=p.eps||[];

  $('quals').innerHTML=['FHD','HD','SD'].map(q=>{
    const list=(byQ[q]||[]).sort((a,b)=>String(a.s).localeCompare(b.s,0,{numeric:true})||String(a.n).localeCompare(b.n,0,{numeric:true}));
    return `<div class="box"><h3 style="margin:0 0 8px">${q}</h3>`+
    (list.map(e=>{
      const idx=EPS.indexOf(e);
      return `<div class="ep">
        <span>S${esc(e.s)} E${esc(e.n)}</span>
        <button class="primary" onclick="goVerify(${idx})">Download</button>
        ${e.play?`<button onclick="playEp(${idx})">Play</button>`:''}
        ${e.pd?`<button onclick="vipDirect(${idx})">VIP Direct</button>`:''}
      </div>`;
    }).join('') || '<small class="mu">Is quality me episode nahi</small>')+'</div>';
  }).join('');
}

function goVerify(i){
  const e=EPS[i];
  // anti-bypass: set pending for verify.html
  setPending(e.id);
  sessionStorage.setItem('pending_post', POST.id);
  // go to verify page with post id + ep id - shortener solve ke baad real link milega
  location.href=`verify.html?id=${encodeURIComponent(POST.id)}&ep=${encodeURIComponent(e.id)}`;
}

async function vipDirect(i){
  const vk=localStorage.getItem('vk');
  const vexp=parseInt(localStorage.getItem('vexp')||'0');
  if(!vk || vexp<Date.now()){ location.href='vip.html'; return; }
  const real=await dec(EPS[i].pd, vk);
  if(real && isUrl(real)) window.open(real,'_blank');
  else alert('VIP decrypt fail, dobara login karo');
}

function playEp(i){
  const e=EPS[i];
  if(!e.play) return;
  if(e.lock){
    const pwd=prompt('Play Password:'); if(!pwd) return;
    dec(e.play, pwd).then(l=>{ if(l) showPlayer(l); else alert('Password galat'); });
  }else showPlayer(e.play);
}

function showPlayer(link){
  if(!isUrl(link)) return;
  const isVid=/\.(mp4|webm|m3u8)(\?|$)/i.test(link);
  const el=document.createElement(isVid?'video':'iframe');
  el.src=link;
  if(isVid) el.controls=true; else el.allowFullscreen=true;
  el.style.width='100%'; el.style.aspectRatio='16/9'; el.style.border='0'; el.style.borderRadius='14px'; el.style.background='#000';
  const p=$('player'); p.innerHTML=''; p.appendChild(el);
  el.scrollIntoView({block:'center'});
}

init();
</script>
</body>
</html>
